<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Iron Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Kanit:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column gym logbook, sticky brand bar, fixed bottom tabs, rest-timer dock floating above tabs.
   Palette borrows from competition plates: blue 20 kg = accent, yellow 15 kg = PR, red/green/white for the plate calculator. */
:root {
  --bg: #ECEEE9;
  --surface: #FFFFFF;
  --surface-2: #F4F5F1;
  --ink: #16191B;
  --muted: #5C645F;
  --line: #D5D9D2;
  --accent: #2350C8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E8F8;
  --pr: #A87700;
  --pr-soft: #FBEFCF;
  --good: #1D7F47;
  --good-soft: #DCEFE3;
  --danger: #C02C38;
  --danger-soft: #F7E0E2;
  --body: #D3D8D1;
  --p25: #D22F3A; --p20: #2350C8; --p15: #E2B007; --p10: #2E8B4E; --p5: #F6F6F2; --p2: #34393C; --p1: #9AA0A3;
  --m0: #DDB9B1; --m-hot: #C4222B; --neu: #E2D3CA; --skin: #EDE3DB; --m-edge: #B8948C; --m-fiber: rgba(110,30,30,.28);
  --steel: #8E979C;
  --shadow: 0 1px 2px rgba(22,25,27,.06), 0 6px 20px rgba(22,25,27,.06);
  --f-display: "Kanit", "Anuphan", system-ui, sans-serif;
  --f-body: "Anuphan", "Kanit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Barlow Condensed", "Kanit", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1214; --surface: #181C1F; --surface-2: #1F2427; --ink: #E9ECE6; --muted: #98A19B; --line: #2B3135;
    --accent: #7097F5; --accent-ink: #0D1424; --accent-soft: #1B2644; --pr: #F0BE3A; --pr-soft: #3A2F12;
    --good: #4CC27E; --good-soft: #15301F; --danger: #F06A73; --danger-soft: #3A1A1D; --body: #2C3337;
    --p5: #E9E9E4; --p2: #50575B; --steel: #7A8388; --m0: #5C3D3A; --m-hot: #F2474D; --neu: #3D3331; --skin: #332B29; --m-edge: #1B1514; --m-fiber: rgba(0,0,0,.38);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1214; --surface: #181C1F; --surface-2: #1F2427; --ink: #E9ECE6; --muted: #98A19B; --line: #2B3135;
  --accent: #7097F5; --accent-ink: #0D1424; --accent-soft: #1B2644; --pr: #F0BE3A; --pr-soft: #3A2F12;
  --good: #4CC27E; --good-soft: #15301F; --danger: #F06A73; --danger-soft: #3A1A1D; --body: #2C3337;
  --p5: #E9E9E4; --p2: #50575B; --steel: #7A8388; --m0: #5C3D3A; --m-hot: #F2474D; --neu: #3D3331; --skin: #332B29; --m-edge: #1B1514; --m-fiber: rgba(0,0,0,.38);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); }

.app {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(150px + env(safe-area-inset-bottom, 0px));
}

/* Top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px; background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; letter-spacing: .08em; }
.brand-sub { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .02em; font-family: var(--f-body); font-weight: 500; margin-top: -2px; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 18px; height: 18px; }

/* Generic */
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.sec-h { font-size: 1.05rem; margin-top: 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h small { font-family: var(--f-body); font-weight: 500; font-size: .8rem; color: var(--muted); }
.eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-family: var(--f-display); font-weight: 500; font-size: .95rem;
  transition: transform .08s, background .15s;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); background: transparent; }
.btn.sm { padding: 7px 12px; font-size: .85rem; border-radius: 10px; }
.btn.block { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.pr { background: var(--pr-soft); color: var(--pr); border-color: transparent; }
.db-toggle { cursor: pointer; font-family: var(--f-body); }
.db-toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: .82rem; font-weight: 600; color: var(--muted); }
.input, select.input {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 1rem; min-width: 0;
}
.input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .grow { flex: 1 1 180px; }
.empty { color: var(--muted); font-size: .9rem; padding: 18px 4px; text-align: center; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--pr-soft); color: var(--ink); font-size: .88rem; }
.banner b { color: var(--pr); }

/* Start screen */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 20px; background: var(--ink); color: var(--bg); border: 0; position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; }
.hero p { margin: 6px 0 16px; color: color-mix(in srgb, var(--bg) 72%, var(--ink)); font-size: .92rem; max-width: 38ch; }
.hero .btn.primary { background: var(--p15); border-color: var(--p15); color: #16191B; }
.hero-plate { width: 120px; height: 120px; opacity: .95; }
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 4px; }
.week-day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .75rem; color: var(--muted); }
.week-dot { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--line); display: grid; place-items: center; font-family: var(--f-num); font-size: .95rem; color: var(--muted); }
.week-dot.on { background: var(--accent); border: 0; color: var(--accent-ink); font-weight: 700; }
.week-dot.today { border: 2px solid var(--ink); }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tpl { text-align: left; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .15s, transform .08s; position: relative; }
.tpl:hover { border-color: var(--accent); }
.tpl:active { transform: scale(.99); }
.tpl h3 { font-size: 1.1rem; }
.tpl .meta { font-size: .8rem; color: var(--muted); }
.tpl .list { font-size: .8rem; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tpl-del { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.tpl-del:hover { background: var(--danger-soft); color: var(--danger); }

/* Session */
.sess-head { display: flex; flex-direction: column; gap: 14px; position: relative; }
.sess-title { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.sess-name { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; border: 0; background: transparent; padding: 2px 0; min-width: 0; flex: 1; border-bottom: 1px dashed transparent; }
.sess-name:focus { outline: none; border-bottom-color: var(--accent); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600; color: var(--good); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: .72rem; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--f-num); font-size: 1.6rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: .9rem; color: var(--muted); font-weight: 500; margin-left: 2px; }
.rest-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rest-ctl .lbl { font-size: .85rem; font-weight: 600; color: var(--muted); margin-right: auto; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); width: 40px; height: 40px; font-size: 1.2rem; }
.stepper span { min-width: 64px; text-align: center; font-family: var(--f-num); font-size: 1.3rem; font-weight: 600; }

.ex { display: flex; flex-direction: column; gap: 12px; transition: border-color .2s; scroll-margin-top: 80px; }
.ex.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ex.complete { opacity: .82; }
.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ex-head h3 { font-size: 1.12rem; }
.ex-head .chips { margin-top: 6px; }
.ex-tools { display: flex; gap: 2px; flex: none; }
.ex-tools button { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.ex-tools button:hover { background: var(--surface-2); color: var(--ink); }
.ex-tools svg { width: 16px; height: 16px; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 46px; gap: 8px; align-items: center; padding: 4px; border-radius: 12px; transition: background .2s; }
.set-row.head { font-size: .72rem; font-weight: 600; color: var(--muted); padding-block: 0; }
.set-row.head span { text-align: center; }
.set-row.done { background: var(--good-soft); }
.setno { text-align: center; font-family: var(--f-num); font-weight: 600; font-size: 1.1rem; display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
.setno small { font-family: var(--f-body); font-size: .62rem; color: var(--muted); font-weight: 500; }
.setno .chip { padding: 0 5px; font-size: .62rem; margin-top: 2px; }
.prev { text-align: center; font-family: var(--f-num); font-size: 1rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-row input { width: 100%; text-align: center; padding: 9px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--f-num); font-size: 1.2rem; font-weight: 600; min-width: 0; }
.set-row input::placeholder { color: color-mix(in srgb, var(--muted) 60%, transparent); }
.set-row input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.set-row.done input { background: transparent; border-color: transparent; }
.check { width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); justify-self: center; }
.check svg { width: 20px; height: 20px; }
.set-row.done .check { background: var(--good); border-color: var(--good); color: var(--surface); }
.ex-foot { display: flex; gap: 8px; flex-wrap: wrap; }
.add-ex .row { align-items: stretch; }
.sess-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sess-actions .wide { grid-column: 1 / -1; padding: 15px; font-size: 1.05rem; }

/* Rest dock */
.rest-dock {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 25;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--ink); color: var(--bg); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.rest-dock.flash { animation: flash .5s 3; }
@keyframes flash { 50% { background: var(--good); } }
.ring { width: 52px; height: 52px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .bgc { stroke: color-mix(in srgb, var(--bg) 22%, var(--ink)); }
.ring .fgc { stroke: var(--p15); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.rest-info { flex: 1; min-width: 0; }
.rest-info .k { font-size: .72rem; opacity: .7; }
.rest-info .v { font-family: var(--f-num); font-size: 2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.rest-dock button { border: 0; border-radius: 10px; padding: 9px 10px; background: color-mix(in srgb, var(--bg) 14%, var(--ink)); color: var(--bg); font-family: var(--f-num); font-size: 1rem; font-weight: 600; }
.rest-dock button.skip { background: var(--p15); color: #16191B; font-family: var(--f-display); font-size: .85rem; }

/* Tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 24;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs button { border: 0; background: transparent; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .74rem; font-weight: 600; color: var(--muted); position: relative; }
.tabs svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tabs .badge { position: absolute; top: 6px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--good); }

/* History & progress */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tile .k { font-size: .75rem; color: var(--muted); font-weight: 600; }
.tile .v { font-family: var(--f-num); font-size: 2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 1rem; color: var(--muted); font-weight: 500; margin-left: 3px; }
.tile.pr .v { color: var(--pr); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-num); font-size: 13px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.heat-wrap { overflow-x: auto; }
.heat { width: 100%; max-width: 520px; height: auto; display: block; }
.heat text { fill: var(--muted); font-size: 9px; font-family: var(--f-body); }
.heat-legend { display: flex; align-items: center; gap: 4px; font-size: .75rem; color: var(--muted); justify-content: flex-end; }
.heat-legend span { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.hist { padding: 0; overflow: hidden; }
.hist-head { width: 100%; text-align: left; border: 0; background: transparent; padding: 14px 16px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
.hist-date { text-align: center; border-radius: 12px; background: var(--surface-2); padding: 6px 0; line-height: 1.05; }
.hist-date b { display: block; font-family: var(--f-num); font-size: 1.5rem; }
.hist-date span { font-size: .7rem; color: var(--muted); font-weight: 600; }
.hist-head h3 { font-size: 1.02rem; }
.hist-head .chips { margin-top: 5px; }
.hist-head .caret { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
.hist.open .caret { transform: rotate(180deg); }
.hist-body { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.tbl-wrap { overflow-x: auto; }
table.log { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.log th, table.log td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.log th { font-size: .72rem; color: var(--muted); font-weight: 600; }
table.log td.n { font-family: var(--f-num); font-size: 1rem; font-variant-numeric: tabular-nums; }
table.log tr.exrow td { font-family: var(--f-display); font-weight: 500; background: var(--surface-2); }
.mbars { display: flex; flex-direction: column; gap: 7px; }
.mbar { display: grid; grid-template-columns: 82px 1fr 34px; gap: 10px; align-items: center; font-size: .82rem; }
.mbar .track { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; position: relative; }
.mbar .fill { height: 100%; background: var(--m-hot); border-radius: 99px; }
.mbar .zone { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--muted); border-right: 1px dashed var(--muted); opacity: .5; }
.mbar .n { text-align: right; font-family: var(--f-num); font-weight: 600; font-size: 1rem; }
.map-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: center; }
.bodymap { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; }
.bodymap text { fill: var(--muted); font-size: 15px; font-family: var(--f-body); font-weight: 600; }
.bodymap .mus { cursor: pointer; }
.bodymap .mus:hover path:first-of-type { stroke: var(--ink); stroke-width: 1.4; }
.bm-legend { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: .75rem; color: var(--muted); margin-top: 4px; }
.bm-legend i { width: 120px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--m0), var(--m-hot)); }

/* Tools */
.big-out { display: flex; align-items: baseline; gap: 8px; }
.big-out .v { font-family: var(--f-num); font-size: 3rem; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.pct-row { display: grid; grid-template-columns: 44px 1fr 70px 56px; gap: 10px; align-items: center; font-size: .85rem; padding: 3px 0; }
.pct-row .bar { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.pct-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.pct-row .w { font-family: var(--f-num); font-size: 1.05rem; font-weight: 600; text-align: right; }
.pct-row .r { color: var(--muted); text-align: right; font-size: .78rem; }
.plate-svg { width: 100%; height: auto; display: block; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .92rem; }
.toggle:first-of-type { border-top: 0; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Modal & toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,14,.55); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--surface); color: var(--ink); border-radius: 20px; width: 100%; max-width: 460px; max-height: calc(100% - 20px); overflow-y: auto; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.sheet h2 { font-size: 1.3rem; }
.sheet p { margin: 0; color: var(--muted); white-space: pre-line; }
.sheet .btns { display: flex; flex-direction: column; gap: 8px; }
.sheet textarea { width: 100%; min-height: 150px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .75rem; resize: vertical; }
.sum-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  max-width: min(440px, calc(100% - 32px)); padding: 11px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg); font-size: .9rem; font-weight: 500; box-shadow: var(--shadow); text-align: center;
  animation: drop .25s ease-out;
}
.toast.pr { background: var(--p15); color: #16191B; font-weight: 600; }
@keyframes drop { from { transform: translate(-50%, -12px); opacity: 0; } }

@media (min-width: 761px) { .modal { align-items: center; } }
@media (max-width: 620px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .two, .map-grid { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .hero-plate { position: absolute; right: -24px; top: -20px; width: 110px; height: 110px; opacity: .25; }
}
@media (max-width: 400px) {
  .set-row { grid-template-columns: 38px minmax(0, .9fr) minmax(0, 1fr) minmax(0, 1fr) 42px; gap: 6px; }
  .stat .v { font-size: 1.35rem; }
  .brand-sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------------- Sample data ---------------- */
function seedSample() {
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const BASE = {
    'Bench Press': [50, 10, 2.5], 'Incline Bench Press': [40, 10, 2.5], 'Decline Bench Press': [45, 10, 2.5], 'Dip': [0, 12, 0], 'Trap': [40, 12, 2.5],
    'Bent Over Row': [40, 10, 2.5], 'Cable Row': [45, 12, 2.5], 'Lat Pull Down': [45, 12, 2.5], 'Shoulder Press': [30, 10, 2.5], 'Upright Row': [25, 12, 2.5],
    'Side Lateral Raise': [7, 12, .5], 'Front Lateral Raise': [7, 12, .5], 'Rear Lateral Raise': [6, 12, .5], 'Bicep Curl': [12, 10, 1], 'Hammer Curl': [12, 10, 1],
    'Triceps Push Down': [25, 12, 2.5], 'Dumbell Rotation': [4, 15, 0], 'Squat': [60, 10, 5], 'Calf Raise': [60, 15, 5], 'Oblique Side Bend': [15, 15, 1],
    'Abs Crunch': [0, 20, 0], 'Dip Bar Leg Raise': [0, 12, 0]
  };
  const today = dayStart(Date.now());
  const order = ['chest-back', 'abs-leg', 'shoulder-arm'];
  const best = {}; const out = []; let k = 0;
  for (let d = 56; d >= 1; d--) {
    const day = new Date(today - d * DAY); day.setHours(12);
    if (![1, 3, 5].includes(day.getDay())) continue;
    if (rnd() < 0.1) continue;
    const p = PRESETS.find(x => x.id === order[k++ % 3]);
    const wk = Math.floor((56 - d) / 7);
    const start = new Date(day); start.setHours(18, Math.floor(rnd() * 40), 0, 0);
    let ts = start.getTime() + 6 * 60000;
    const exercises = p.list.map(name => {
      const [bw, br, inc] = BASE[name];
      const step = bw >= 20 ? 2.5 : .5;
      const w = bw ? Math.round((bw + inc * Math.floor(wk / 2) + (rnd() < .25 ? inc : 0)) / step) * step : 0;
      const had = name in best; let cur = had ? best[name] : 0;
      const sets = [];
      for (let i = 0; i < 5; i++) {
        ts += (95 + rnd() * 70) * 1000;
        const r = Math.max(5, br - (i > 2 ? 1 + Math.floor(rnd() * 2) : 0) + (bw === 0 ? Math.floor(wk / 3) : 0));
        const v = e1(w, r); let pr = false;
        if (v > cur + 0.01) { if (had && v > 0) pr = true; cur = v; }
        sets.push({ w, r, t: hhmm(ts), ts, pr });
      }
      best[name] = cur; ts += 100 * 1000;
      return { name, muscle: LIB[name], db: DB_DEFAULT.has(name), sets };
    });
    out.push({ id: 'sample-' + out.length, sample: true, start: start.getTime(), end: ts + 4 * 60000, name: L().presets[p.id], presetId: p.id, exercises });
  }
  S.history = out; S.seeded = true; save();
}

function niceTicks(min, max, n = 4) {
  if (max === min) { max += Math.max(1, Math.abs(max) * .1); min -= Math.max(1, Math.abs(min) * .1); }
  const step = niceStep((max - min) / n);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { ticks, step };
}
const short = v => v >= 1e6 ? r1(v / 1e6) + 'M' : v >= 1000 ? r1(v / 1000) + 'k' : String(r1(v));

function lineChart(series, unit) {
  const all = series.flatMap(s => s.pts);
  if (series[0].pts.length < 2) return `<p class="empty">${esc(t('needData'))}</p>`;
  const W = 420, H = 230, Lp = 38, R = 40, T = 14, B = 28;
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const { ticks, step } = niceTicks(Math.min(...ys), Math.max(...ys), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const sx = x => Lp + (x - x0) / ((x1 - x0) || 1) * (W - Lp - R);
  const sy = y => T + (1 - (y - y0) / ((y1 - y0) || 1)) * (H - T - B);
  const dec = step < 1 ? 1 : 0;
  let g = ticks.map(v => `<line class="grid" x1="${Lp}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${Lp - 8}" y="${sy(v) + 4}" text-anchor="end">${v.toFixed(dec)}</text>`).join('');
  const nX = Math.min(4, series[0].pts.length);
  for (let i = 0; i < nX; i++) {
    const x = x0 + (x1 - x0) * (nX === 1 ? 0 : i / (nX - 1));
    g += `<text x="${sx(x)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === nX - 1 ? 'end' : 'middle'}">${esc(fmtDate(x, { day: 'numeric', month: 'short' }))}</text>`;
  }
  const paths = series.map((s, si) => {
    const d = s.pts.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join(' ');
    const last = s.pts[s.pts.length - 1];
    const area = s.area ? `<path d="${d} L${sx(last.x).toFixed(1)} ${sy(y0)} L${sx(s.pts[0].x).toFixed(1)} ${sy(y0)} Z" fill="${s.color}" fill-opacity=".12" stroke="none"/>` : '';
    const dots = s.area ? s.pts.map(p => `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" fill="${s.color}"/>`).join('') : '';
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.area ? 2.6 : 1.8}" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>${dots}
      <circle cx="${sx(last.x)}" cy="${sy(last.y)}" r="${si ? 3.5 : 5}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${sx(last.x) + 9}" y="${sy(last.y) + 4 + (si ? 8 : -4)}" style="fill:${s.color};font-weight:700;font-size:15px">${num(last.y)}${unit ? '' : ''}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${paths}</svg>`;
}

function barChart(items) {
  const W = 420, H = 220, Lp = 38, R = 4, T = 22, B = 28;
  const max = Math.max(1, ...items.map(i => i.v));
  const { ticks } = niceTicks(0, max, 4);
  const top = ticks[ticks.length - 1];
  const sy = v => T + (1 - v / top) * (H - T - B);
  const slot = (W - Lp - R) / items.length, bw = Math.min(38, slot * .62);
  let g = ticks.map(v => `<line class="grid" x1="${Lp}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${Lp - 8}" y="${sy(v) + 4}" text-anchor="end">${short(v)}</text>`).join('');
  items.forEach((it, i) => {
    const cx = Lp + slot * i + slot / 2, y = sy(it.v), h = sy(0) - y;
    if (it.v > 0) g += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(h, 1)}" rx="4" fill="var(--accent)" fill-opacity="${it.cur ? .45 : 1}"><title>${esc(it.label)}: ${num(it.v, 0)} kg</title></rect>`;
    if (it.v > 0) g += `<text x="${cx}" y="${y - 6}" text-anchor="middle" style="font-size:10.5px">${short(it.v)}</text>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" style="font-size:11px">${esc(it.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function heatmap() {
  const weeks = 16, cell = 13, gap = 3, left = 22, topP = 16;
  const byDay = {}; S.history.forEach(r => { const k = dayStart(r.start); byDay[k] = (byDay[k] || 0) + Math.max(recVol(r), 1); });
  const vals = Object.values(byDay); const mx = Math.max(1, ...vals);
  const ws = weekStart(Date.now()); const today = dayStart(Date.now());
  let g = ''; let lastMonth = -1;
  for (let c = 0; c < weeks; c++) {
    const w0 = ws - (weeks - 1 - c) * 7 * DAY;
    const m = new Date(w0 + 3 * DAY).getMonth();
    if (m !== lastMonth) { g += `<text x="${left + c * (cell + gap)}" y="10">${esc(fmtDate(w0 + 3 * DAY, { month: 'short' }))}</text>`; lastMonth = m; }
    for (let r = 0; r < 7; r++) {
      const d = dayStart(w0 + r * DAY + 3 * 3600e3);
      if (d > today) continue;
      const v = byDay[d] || 0;
      const lvl = v ? (v / mx < .34 ? .35 : v / mx < .67 ? .65 : 1) : 0;
      g += `<rect x="${left + c * (cell + gap)}" y="${topP + r * (cell + gap)}" width="${cell}" height="${cell}" rx="3" fill="${lvl ? 'var(--accent)' : 'var(--surface-2)'}" ${lvl ? `fill-opacity="${lvl}"` : 'stroke="var(--line)"'} ${d === today ? 'stroke="var(--ink)" stroke-width="1.5"' : ''}><title>${esc(fmtDate(d, { day: 'numeric', month: 'short' }))}${v ? ': ' + num(v, 0) + ' kg' : ''}</title></rect>`;
    }
  }
  [0, 2, 4].forEach(r => g += `<text x="0" y="${topP + r * (cell + gap) + 10}">${esc(L().dows[r])}</text>`);
  const W = left + weeks * (cell + gap), H = topP + 7 * (cell + gap);
  return `<div class="heat-wrap"><svg class="heat" viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>
    <div class="heat-legend">${t('less')} <span style="background:var(--surface-2);border:1px solid var(--line)"></span><span style="background:var(--accent);opacity:.35"></span><span style="background:var(--accent);opacity:.65"></span><span style="background:var(--accent)"></span> ${t('more')}</div>`;
}

function plateSvg(perSide, bar) {
  const W = 380, H = 124, cy = 62;
  let g = `<rect x="8" y="${cy - 3}" width="${W - 16}" height="6" rx="3" fill="var(--steel)"/>`;
  g += `<rect x="96" y="${cy - 9}" width="8" height="18" rx="2" fill="var(--steel)"/><rect x="${W - 104}" y="${cy - 9}" width="8" height="18" rx="2" fill="var(--steel)"/>`;
  g += `<rect x="8" y="${cy - 6}" width="88" height="12" rx="3" fill="var(--steel)" fill-opacity=".7"/><rect x="${W - 96}" y="${cy - 6}" width="88" height="12" rx="3" fill="var(--steel)" fill-opacity=".7"/>`;
  let xr = W - 96 + 1, xl = 96 - 1;
  perSide.forEach(p => {
    const [col, h, w] = PLATE_STYLE[p];
    const stroke = p === 5 ? 'stroke="var(--line)" stroke-width="1"' : '';
    g += `<rect x="${xr}" y="${cy - h / 2}" width="${w}" height="${h}" rx="2.5" fill="var(${col})" ${stroke}/>`;
    g += `<rect x="${xl - w}" y="${cy - h / 2}" width="${w}" height="${h}" rx="2.5" fill="var(${col})" ${stroke}/>`;
    xr += w + 1.5; xl -= w + 1.5;
  });
  g += `<text x="${W / 2}" y="${cy - 14}" text-anchor="middle" style="font-size:14px">${esc(t('barW'))} ${bar} kg</text>`;
  return `<svg class="plate-svg chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function calcPlates(target, bar) {
  let side = (target - bar) / 2; const out = [];
  if (side < 0) return { out, rem: 0, neg: true };
  for (const p of PLATES) while (side >= p - 1e-9) { out.push(p); side = Math.round((side - p) * 100) / 100; }
  return { out, rem: Math.round(side * 100) / 100 };
}

function viewProgress() {
  const h = sorted(); const now = Date.now();
  const ws = weekStart(now);
  let streak = 0; { let w = ws; const weeks = new Set(h.map(r => weekStart(r.start))); if (!weeks.has(w)) w -= 7 * DAY; while (weeks.has(w)) { streak++; w = weekStart(w - 3 * DAY); } }
  const last30 = h.filter(r => r.start >= now - 30 * DAY);
  const vol30 = last30.reduce((a, r) => a + recVol(r), 0);
  const pr30 = last30.reduce((a, r) => a + recPRs(r), 0);
  // weekly volume, 10 weeks
  const weeks = []; for (let i = 9; i >= 0; i--) { const w0 = weekStart(ws - i * 7 * DAY + 3 * DAY); weeks.push({ w0, v: 0, cur: i === 0 }); }
  h.forEach(r => { const wk = weeks.find(x => x.w0 === weekStart(r.start)); if (wk) wk.v += recVol(r); });
  const bars = barChart(weeks.map(w => ({ label: fmtDate(w.w0, { day: 'numeric', month: 'numeric' }), v: w.v, cur: w.cur })));
  // exercise progress
  const names = [...new Set(h.flatMap(r => r.exercises.map(e => e.name)))];
  if (!progEx || !names.includes(progEx)) progEx = names.includes('Bench Press') ? 'Bench Press' : names[0];
  let exChart = `<p class="empty">${t('needData')}</p>`, legend = '';
  if (progEx) {
    const pts = h.map(r => { const e = r.exercises.find(x => x.name === progEx); if (!e) return null; return { x: r.start, e: Math.max(...e.sets.map(s => e1(+s.w, +s.r))), w: Math.max(...e.sets.map(s => +s.w)), r: Math.max(...e.sets.map(s => +s.r)) }; }).filter(Boolean);
    const bw = pts.every(p => p.e === 0);
    if (bw) {
      exChart = lineChart([{ pts: pts.map(p => ({ x: p.x, y: p.r })), color: 'var(--accent)', area: true }]);
      legend = `<div class="legend"><span><i style="background:var(--accent)"></i>${t('maxReps')}</span></div>`;
    } else {
      exChart = lineChart([{ pts: pts.map(p => ({ x: p.x, y: r1(p.e) })), color: 'var(--accent)', area: true }, { pts: pts.map(p => ({ x: p.x, y: p.w })), color: 'var(--muted)', dash: true }]);
      const first = pts[0], last = pts[pts.length - 1];
      const gain = first && last && first.e ? ((last.e - first.e) / first.e * 100) : 0;
      legend = `<div class="legend"><span><i style="background:var(--accent)"></i>${t('e1rmLine')} (kg)</span><span><i style="background:var(--muted)"></i>${t('topSet')} (kg)</span>${pts.length > 1 ? `<span class="chip ${gain >= 0 ? 'acc' : ''}">${gain >= 0 ? '+' : ''}${num(gain, 1)}%</span>` : ''}</div>`;
    }
  }
  // muscles 7 days
  const counts = {}; h.filter(r => r.start >= now - 7 * DAY).forEach(r => r.exercises.forEach(e => counts[e.muscle] = (counts[e.muscle] || 0) + e.sets.length));
  const scale = Math.max(24, ...Object.values(counts));
  const mbars = MUSCLES.map(m => { const c = counts[m] || 0; return `<div class="mbar"><span>${esc(mName(m))}</span><div class="track"><span class="zone" style="left:${10 / scale * 100}%;width:${10 / scale * 100}%"></span><div class="fill" style="width:${c / scale * 100}%;opacity:${c ? 1 : 0}"></div></div><span class="n">${c}</span></div>`; }).join('');
  return `${sampleBanner()}
    <div class="tiles">
      <div class="tile"><div class="k">${t('workouts')}</div><div class="v">${h.length}</div></div>
      <div class="tile"><div class="k">${t('weekStreak')}</div><div class="v">${streak}</div></div>
      <div class="tile"><div class="k">${t('vol30')}</div><div class="v">${num(vol30 / 1000, 1)}<small>${t('tons')}</small></div></div>
      <div class="tile pr"><div class="k">${t('pr30')}</div><div class="v">${pr30}</div></div>
    </div>
    <section class="card stack" style="gap:10px">
      <div class="sec-h" style="margin:0"><span>${t('exProgress')}</span></div>
      ${names.length ? `<select class="input" id="progEx" aria-label="${t('exProgress')}">${names.map(n => `<option ${n === progEx ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : ''}
      ${exChart}${legend}
    </section>
    <section class="card stack" style="gap:10px">
      <div class="sec-h" style="margin:0"><span>${t('weeklyVol')}</span><small>${t('weeklyVolSub')}</small></div>
      ${bars}
    </section>
    <section class="card stack" style="gap:12px">
      <div class="sec-h" style="margin:0"><span>${t('muscle7')}</span></div>
      <div class="map-grid">${bodyMap(counts, 12)}<div class="mbars">${mbars}</div></div>
      <p class="muted" style="margin:0;font-size:.8rem">${t('muscle7Sub')}</p>
    </section>`;
}

function updateTools() {
  const w = parseFloat($('#rmW')?.value) || 0, r = parseInt($('#rmR')?.value, 10) || 0;
  const est = e1(w, Math.min(r, 30));
  const PCT = [[100, 1], [95, 2], [90, 4], [85, 6], [80, 8], [75, 10], [70, 12], [65, 15], [60, 18]];
  const rnd = v => Math.round(v / 2.5) * 2.5;
  if ($('#rmOut')) $('#rmOut').innerHTML = `<div class="big-out"><span class="v num">${est ? num(r1(est)) : '–'}</span><span class="muted">kg · ${t('est1rm')}</span></div>
    <div class="eyebrow" style="margin:12px 0 6px">${t('pctTable')}</div>
    ${PCT.map(([p, reps]) => `<div class="pct-row"><span class="num" style="font-weight:600">${p}%</span><div class="bar"><i style="width:${p}%"></i></div><span class="w">${est ? num(rnd(est * p / 100)) : '–'} kg</span><span class="r">~${reps} ${t('reps')}</span></div>`).join('')}`;
  const target = parseFloat($('#plTarget')?.value) || 0, bar = parseFloat($('#plBar')?.value) || 20;
  if ($('#plOut')) {
    const { out, rem, neg } = calcPlates(target, bar);
    const ramp = target > bar ? [[0, 'bar', 10], [.4, '', 8], [.6, '', 5], [.8, '', 3], [.9, '', 1]].map(([p, lbl, reps]) => `<span class="chip">${lbl ? t('barW') : num(Math.max(bar, Math.round(target * p / 2.5) * 2.5)) + ' kg'} × ${reps}</span>`).join('') : '';
    $('#plOut').innerHTML = neg ? `<p class="empty">${t('tooLight')}</p>` : `${plateSvg(out, bar)}
      <div class="row" style="justify-content:space-between;align-items:center"><span class="muted" style="font-size:.85rem">${t('perSide')}</span><span class="num" style="font-size:1.4rem;font-weight:700">${out.length ? out.join(' + ') + ' kg' : t('barOnly')}</span></div>
      ${rem > 0 ? `<p style="margin:0;color:var(--danger);font-size:.85rem">${t('remainder', { v: num(rem, 2) })}</p>` : ''}
      ${ramp ? `<div class="eyebrow" style="margin-top:6px">${t('warmup')}</div><div class="chips">${ramp}</div>` : ''}`;
  }
}

/* ---------------- Export / backup ---------------- */
function rowsFor(recs) {
  const head = ['Date', 'Workout', 'Exercise', 'Muscle', 'Set', 'Time', 'Weight (kg)', 'Per dumbbell', 'Reps', 'Volume (kg)', 'e1RM (kg)', 'PR'];
  const rows = [head];
  recs.forEach(r => r.exercises.forEach(e => e.sets.forEach((s, i) => rows.push([
    new Date(r.start).toISOString().slice(0, 10), r.name, e.name, mName(e.muscle), i + 1, s.t || '', s.w, isDb(e) ? 'x2' : '', s.r, setVol(s, e), r1(e1(+s.w, +s.r)), s.pr ? 'PR' : ''
  ]))));
  return rows;
}
const csvCell = v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function showExport(recs) {
  const rows = rowsFor(recs);
  const tsv = rows.map(r => r.map(c => String(c).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n');
  pendingFile = { name: `IronLog_${new Date().toISOString().slice(0, 10)}.csv`, data: csv, type: 'text/csv;charset=utf-8' };
  openModal(`<h2>${t('csvTitle')}</h2><p>${t('csvHint')}</p>
    <textarea id="exportText" readonly>${esc(tsv)}</textarea>
    <div class="btns"><button type="button" class="btn primary" data-act="copyText">${t('copy')}</button>
    <button type="button" class="btn" data-act="downloadFile">${t('download')}</button>
    <button type="button" class="btn ghost" data-act="modalCancel">${t('close')}</button></div>`);
}
let pendingFile = null;
function downloadPending() {
  if (!pendingFile) return;
  try {
    const url = URL.createObjectURL(new Blob([pendingFile.data], { type: pendingFile.type }));
    const a = document.createElement('a'); a.href = url; a.download = pendingFile.name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) {}
}
function copyText() {
  const ta = $('#exportText'); if (!ta) return;
  const fallback = () => { ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} toast(ok ? t('copied') : t('copyFail')); };
  try { navigator.clipboard.writeText(ta.value).then(() => toast(t('copied')), fallback); } catch (e) { fallback(); }
}
function showBackup() {
  const data = JSON.stringify({ app: 'ironlog', v: 1, history: S.history, templates: S.templates, settings: S.settings }, null, 1);
  pendingFile = { name: `IronLog_backup_${new Date().toISOString().slice(0, 10)}.json`, data, type: 'application/json' };
  openModal(`<h2>${t('exportBackup')}</h2><p>${t('backupDesc')}</p><textarea id="exportText" readonly>${esc(data)}</textarea>
    <div class="btns"><button type="button" class="btn primary" data-act="copyText">${t('copy')}</button>
    <button type="button" class="btn" data-act="downloadFile">${t('download')}</button>
    <button type="button" class="btn ghost" data-act="modalCancel">${t('close')}</button></div>`);
}
function showRestore() {
  openModal(`<h2>${t('importBackup')}</h2><p>${t('importHint')}</p><textarea id="importText" placeholder='{"app":"ironlog", ...}'></textarea>
    <input type="file" id="importFile" accept=".json,application/json">
    <div class="btns"><button type="button" class="btn primary" data-act="doImport">${t('doImport')}</button>
    <button type="button" class="btn ghost" data-act="modalCancel">${t('cancel')}</button></div>`);
}
function doImport() {
  try {
    const d = JSON.parse($('#importText').value);
    if (!d || d.app !== 'ironlog' || !Array.isArray(d.history)) throw 0;
    S.history = d.history; S.templates = Array.isArray(d.templates) ? d.templates : []; if (d.settings) S.settings = Object.assign(defaults().settings, d.settings);
    S.seeded = true; save(); closeModal(); render(); toast(t('imported'));
  } catch (e) { toast(t('importErr')); }
}

/* ---------------- Events ---------------- */
document.addEventListener('click', async e => {
  const mu = e.target.closest('.mus');
  if (mu) { toast(`${mName(mu.dataset.m)}: ${mu.dataset.c} ${t('setsUnit')}`); return; }
  const b = e.target.closest('[data-act]'); if (!b) { if (e.target.id === 'modal') closeModal(false); return; }
  const a = b.dataset.act, ei = +b.dataset.ex, id = b.dataset.id;
  switch (a) {
    case 'tab': tab = b.dataset.v; try { history.replaceState(null, '', '#' + tab); } catch (_) {} render(); window.scrollTo({ top: 0 }); break;
    case 'lang': S.lang = b.dataset.v; save(); render(); break;
    case 'theme': {
      const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      S.theme = dark ? 'light' : 'dark'; save(); renderChrome(); break;
    }
    case 'modalOk': closeModal(true); break;
    case 'modalCancel': closeModal(false); break;
    case 'startEmpty': startSession(t('freeWorkout'), []); setTimeout(() => $('#newEx')?.focus(), 50); break;
    case 'startPreset': { const p = PRESETS.find(x => x.id === id); startSession(L().presets[id], p.list); S.session.presetId = id; save(); break; }
    case 'startTpl': if (e.target.closest('.tpl-del')) break; { const tp = S.templates.find(x => x.id === id); if (tp) startSession(tp.name, tp.list); break; }
    case 'delTpl': { e.stopPropagation(); const tp = S.templates.find(x => x.id === id); if (tp && await ask(t('tplDel', { n: tp.name }), { ok: t('del'), danger: true })) { S.templates = S.templates.filter(x => x.id !== id); save(); render(); } break; }
    case 'toggleSet': toggleSet(ei, +b.dataset.set); break;
    case 'toggleDb': { const ex = S.session.exercises[ei]; ex.db = !isDb(ex); save(); render(); toast(ex.db ? t('dbOn', { ex: ex.name }) : t('dbOff', { ex: ex.name })); break; }
    case 'addSet': { const ex = S.session.exercises[ei]; const last = ex.sets[ex.sets.length - 1]; ex.sets.push({ w: last ? last.w : '', r: last ? last.r : '', done: false }); save(); render(); break; }
    case 'removeSet': { const ex = S.session.exercises[ei]; if (ex.sets.length > 1 && !ex.sets[ex.sets.length - 1].done) { ex.sets.pop(); save(); render(); } break; }
    case 'moveEx': { const arr = S.session.exercises, j = ei + +b.dataset.d; if (j >= 0 && j < arr.length) { [arr[ei], arr[j]] = [arr[j], arr[ei]]; save(); render(); } break; }
    case 'delEx': { const ex = S.session.exercises[ei]; if (!ex.sets.some(x => x.done) || await ask(t('confirmDelEx', { ex: ex.name }), { ok: t('del'), danger: true })) { S.session.exercises.splice(ei, 1); save(); render(); } break; }
    case 'addEx': {
      const inp = $('#newEx'); const name = inp.value.trim();
      if (!name) { toast(t('errName')); inp.focus(); break; }
      if (S.session.exercises.some(x => x.name.toLowerCase() === name.toLowerCase())) { toast(t('errDup')); break; }
      S.session.exercises.push({ name, muscle: $('#newMuscle').value, db: dbFor(name), sets: newSetsFor(name) }); save(); render();
      const el = document.getElementById('ex-' + (S.session.exercises.length - 1)); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      break;
    }
    case 'focusAdd': closeModal(false); setTimeout(() => { const i = $('#newEx'); if (i) { i.scrollIntoView({ behavior: 'smooth', block: 'center' }); i.focus({ preventScroll: true }); } }, 60); break;
    case 'restStep': S.settings.rest = Math.min(900, Math.max(0, S.settings.rest + +b.dataset.d)); save(); document.querySelectorAll('#restSetting').forEach(x => x.textContent = mmss(S.settings.rest)); break;
    case 'setsStep': S.settings.sets = Math.min(10, Math.max(1, S.settings.sets + +b.dataset.d)); save(); $('#setsSetting').textContent = S.settings.sets; break;
    case 'startRest': startRest(S.settings.rest); break;
    case 'restAdj': rest.end += +b.dataset.d * 1000; rest.total = Math.max(1, rest.total + +b.dataset.d); if (rest.end < Date.now()) rest.end = Date.now(); tickRest(); break;
    case 'restSkip': stopRest(); break;
    case 'finish': closeModal(); finishSession(); break;
    case 'discard': discardSession(); break;
    case 'saveTpl': {
      const s = S.session; if (!s.exercises.length) { toast(t('tplEmpty')); break; }
      const name = s.name.trim() || t('freeWorkout');
      const list = s.exercises.map(x => ({ name: x.name, muscle: x.muscle, db: isDb(x) }));
      const ex = S.templates.find(x => x.name === name);
      if (ex) ex.list = list; else S.templates.push({ id: uid(), name, list });
      save(); toast(t('tplSaved', { n: name })); break;
    }
    case 'toggleHist': openHist.has(id) ? openHist.delete(id) : openHist.add(id); render(); break;
    case 'delHist': if (await ask(t('delSession'), { ok: t('del'), danger: true })) { S.history = S.history.filter(r => r.id !== id); save(); render(); } break;
    case 'exportOne': { const r = S.history.find(x => x.id === id); if (r) showExport([r]); break; }
    case 'exportAll': showExport(sorted()); break;
    case 'copyText': copyText(); break;
    case 'downloadFile': downloadPending(); break;
    case 'clearSample': S.history = S.history.filter(r => !r.sample); save(); render(); toast(t('sampleCleared')); break;
    case 'backup': showBackup(); break;
    case 'restore': showRestore(); break;
    case 'doImport': doImport(); break;
    case 'resetAll': if (await ask(t('confirmReset'), { ok: t('resetAll'), danger: true })) { const lang = S.lang, theme = S.theme; S = defaults(); S.lang = lang; S.theme = theme; S.seeded = true; save(); stopRest(); render(); toast(t('resetDone')); } break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal(false);
  if (e.key === 'Enter') {
    const el = e.target;
    if (el.id === 'newEx') { e.preventDefault(); document.querySelector('[data-act="addEx"]').click(); }
    else if (el.dataset && el.dataset.f === 'r') { e.preventDefault(); toggleSet(+el.dataset.ex, +el.dataset.set); }
    else if (el.dataset && el.dataset.f === 'w') { e.preventDefault(); const n = document.getElementById(`r-${el.dataset.ex}-${el.dataset.set}`); n && n.focus(); }
    else if (el.matches && el.matches('.tpl[role="button"]')) el.click();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.f && S.session) {
    const set = S.session.exercises[+el.dataset.ex]?.sets[+el.dataset.set]; if (!set || set.done) return;
    set[el.dataset.f] = el.value.replace(',', '.').replace(/[^\d.]/g, ''); save();
  } else if (el.id === 'sessName' && S.session) { S.session.name = el.value; save(); }
  else if (el.id === 'newEx') { const m = LIB[el.value.trim()]; if (m) $('#newMuscle').value = m; }
  else if (['rmW', 'rmR', 'plTarget'].includes(el.id)) { S.tools[el.id] = el.value; save(); updateTools(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'progEx') { progEx = el.value; render(); }
  else if (el.id === 'plBar') { S.tools.plBar = +el.value; save(); updateTools(); }
  else if (el.id === 'optAuto') { S.settings.autoRest = el.checked; save(); }
  else if (el.id === 'optSound') { S.settings.sound = el.checked; save(); if (el.checked) beep(880, .1); }
  else if (el.id === 'optAwake') { S.settings.awake = el.checked; save(); el.checked ? wakeOn() : wakeOff(); }
  else if (el.id === 'importFile' && el.files[0]) { const fr = new FileReader(); fr.onload = () => { $('#importText').value = fr.result; }; fr.readAsText(el.files[0]); }
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) renderChrome(); }); } catch (e) {}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['workout', 'history', 'progress', 'tools'].includes(h) && h !== tab) { tab = h; render(); } });
setInterval(() => {
  if (!S.session) return;
  const el = $('#elapsed'); if (el) el.textContent = clock(Date.now() - S.session.start);
  const st = sessionStats(); const a = $('#stSets'), b = $('#stVol');
  if (a) a.innerHTML = `${st.done}<small>/${st.total}</small>`; if (b) b.innerHTML = `${num(st.vol, 0)}<small>kg</small>`;
}, 1000);

/* ---------------- Boot ---------------- */
if (!S.seeded && !S.history.length) seedSample();
const h0 = location.hash.slice(1);
if (['workout', 'history', 'progress', 'tools'].includes(h0)) tab = h0;
render();
if (S.session) wakeOn();
})();
</script>

</body></html>
